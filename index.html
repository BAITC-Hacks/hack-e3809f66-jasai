<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TASK FORGE — бизнес куёт задачи, студенты берут контракт</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;600;800&family=Space+Grotesk:wght@500;700&family=Unbounded:wght@700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Атмосфера: сетка градиентов + «металлическая пыль» -->
  <div class="mesh" aria-hidden="true"><i></i><i></i><i></i></div>
  <svg class="noise" aria-hidden="true" width="100%" height="100%">
    <filter id="dust"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#dust)"/>
  </svg>

  <header id="header" class="top"></header>
  <main id="app"></main>
  <footer class="foot">
    <span class="hand">Бизнес не пишет задачи. Бизнес куёт их.</span>
    <span>TASK FORGE · MVP хакатона AI Sana</span>
  </footer>

  <canvas id="fx-canvas" aria-hidden="true"></canvas>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="medals" class="medals" aria-live="polite"></div>

  <!-- Загрузчик «Forge Ignites» — один раз за сессию -->
  <div id="loader" class="loader" hidden>
    <div class="spark-core"></div>
    <div class="ray r1"></div><div class="ray r2"></div><div class="ray r3"></div>
    <div class="loader-word">TASK <b>FORGE</b></div>
    <div class="flash"></div>
  </div>

  <script src="js/seed.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/store.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/app.js"></script>
  <script src="js/demo.js"></script>
</body>
</html>
